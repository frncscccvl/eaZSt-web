<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eaZSt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #191C23;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Tappable Giant Icon Container */
    .icon-link {
      display: inline-block;
      text-decoration: none;
      outline: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-link:active {
      transform: scale(0.92);
    }

    /* Giant Centered App Icon */
    .giant-icon {
      width: 144px;
      height: 144px;
      border-radius: 34px;
      object-fit: cover;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.60),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.80);
      }
      100% {
        opacity: 1;
        transform: scale(1.0);
      }
    }
  </style>
</head>
<body>

  <!-- Giant Tappable App Icon (Manual backup button) -->
  <a id="appLink" href="#" class="icon-link" aria-label="Open eaZSt">
    <img src="icon_.png" alt="eaZSt" class="giant-icon" onerror="this.src='../icon_.png'">
  </a>

  <script>
    (function() {
      // 1. Capture payload (Twitch hash, YouTube code, Telegram return, etc.)
      const fragment = window.location.hash || "";
      const search = window.location.search || "";
      const payload = fragment || search;

      const isOAuth = fragment.includes("access_token=") || search.includes("code=");
      const targetHost = isOAuth ? "callback" : "return";

      // ◄ 2. DETECT PLATFORM (iOS vs Android)
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      let targetUri = "";

      if (isIOS) {
        // 🍏 Apple Standard Custom Scheme (Matches Info.plist & eaZStApp.swift)
        targetUri = "com.francis.eazst://" + targetHost + payload;
      } else {
        // 🤖 Android Chrome Intent URI
        targetUri = "intent://" + targetHost + payload + "#Intent;scheme=com.francis.eazst;package=com.francis.eazst;end";
      }

      // 3. Set manual tap link on giant icon
      const linkBtn = document.getElementById("appLink");
      if (linkBtn) {
        linkBtn.href = targetUri;
      }

      // 4. Trigger auto-redirect
      window.location.href = targetUri;
    })();
  </script>
</body>
</html>

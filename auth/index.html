<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eaZSt — Connected</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <style>
    /* ==========================================================================
       1. THEME VARIABLES (Matching eaZSt Palette)
       ========================================================================== */
    :root {
      --bg: #F1F1F3;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(0, 0, 0, 0.06);
      --text-main: #191C23;
      --text-sub: #64748B;
      --btn-bg: #004B75;
      --btn-text: #FFFFFF;
      --accent-green: #036E01;
      --accent-green-bg: #D4F8D3;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131314;
        --card-bg: rgba(30, 31, 32, 0.90);
        --card-border: rgba(255, 255, 255, 0.08);
        --text-main: #E3E3E3;
        --text-sub: #94A3B8;
        --btn-bg: #C2E7FF;
        --btn-text: #003354;
        --accent-green: #8FE58C;
        --accent-green-bg: rgba(143, 229, 140, 0.14);
        --shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
      }
    }

    /* ==========================================================================
       2. LAYOUT & TYPOGRAPHY
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 28px 32px 28px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: var(--shadow);
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ==========================================================================
       3. LOGO & BADGE AVATAR
       ========================================================================== */
    .avatar-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px auto;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .badge {
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 26px;
      height: 26px;
      background-color: var(--accent-green-bg);
      border: 2px solid var(--card-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-green);
      font-size: 13px;
      font-weight: bold;
    }

    /* ==========================================================================
       4. TEXT & PILL BUTTON
       ========================================================================== */
    h2 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-sub);
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      width: 100%;
      height: 48px;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14.5px;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .footer-note {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-top: 18px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrapper">
      <img src="icon_.png" alt="eaZSt" class="app-icon" onerror="this.src='../icon_.png'">
      <div class="badge">&#10003;</div>
    </div>

    <h2>Successfully Linked!</h2>
    <p id="status-desc">Your account is connected. Redirecting you back to eaZSt now...</p>

    <a id="appLink" href="#" class="btn">Open eaZSt</a>
    <div class="footer-note">eaZSt Passive Wealth Engine</div>
  </div>

  <script>
    (function() {
      // 1. Capture query or hash fragments (Twitch, YouTube, Kick, Telegram, etc.)
      const fragment = window.location.hash || "";
      const search = window.location.search || "";
      const payload = fragment || search;
      const isOAuth = fragment.includes("access_token=") || search.includes("code=");
      
      // ◄ 2. PURE ANDROID INTENT URI (Explicit Package Targeted)
      // Directly tells Android OS to launch package com.francis.eazst's MainActivity
      //const androidIntentUri = "intent://callback" + payload + "#Intent;component=com.francis.eazst/.MainActivity;scheme=com.francis.eazst;package=com.francis.eazst;end";

      const targetHost = isOAuth ? "callback" : "return";
      const androidIntentUri = "intent://" + targetHost + payload + "#Intent;scheme=com.francis.eazst;package=com.francis.eazst;end";
      
      // 3. Set manual button target
      /*const linkBtn = document.getElementById("appLink");
      if (linkBtn) {
        linkBtn.href = androidIntentUri;
      }*/

      const linkBtn = document.getElementById("appLink");
      if (linkBtn) {
        linkBtn.href = androidIntentUri;
      }

      // ◄ 4. Trigger immediate Android Intent launch
      window.location.href = androidIntentUri;
      
      // 5. Update subtitle if auto-bounce takes more than 1.8s
      setTimeout(function() {
        const desc = document.getElementById("status-desc");
        if (desc) {
          desc.innerText = "If eaZSt didn't open automatically, tap the button below.";
        }
      }, 1800);
    })();
  </script>
</body>
</html>
